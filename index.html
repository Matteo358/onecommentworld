<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>One Comment World</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="The first fully organic global community. One comment = one house on the map. 575 cities and counting.">
<link rel="icon" href="logo.png">
<link rel="preload" href="engine.js?v=a361fdc2f0" as="script">
<link rel="preload" href="geo-coarse.bin?v=e49bd2043a" as="fetch" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: mappa 3D a tutto schermo, barra in alto, pannello a destra (bottom sheet su telefono) */
:root{
  --sea:#2c6e8a; --sky:#9fd3e0;
  --ink:#f3f7f4; --ink-2:#b9c9cf; --ink-3:#7f949c;
  --panel:#13262f; --panel-2:#1b3440; --line:#2b4a57;
  --sun:#ffcf3f; --sun-ink:#2a2100; --leaf:#7fc25d; --clay:#e0754f;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--body);overflow:hidden}
#app{position:relative;height:100%;width:100%}
#map{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}

/* barra */
.bar{position:absolute;top:0;left:0;right:0;z-index:7;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none}
.brand{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 14px}
.brand img{width:34px;height:34px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 2px #10232b;background:var(--panel-2)}
.brand h1{margin:0;font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.3px;line-height:1}
.brand .tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--sun);color:var(--sun-ink);border-radius:6px;padding:3px 6px}
.stats{pointer-events:auto;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;flex-wrap:wrap}
.stat{padding:4px 10px;display:flex;flex-direction:column;gap:1px}
.stat b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* etichette paesi */
#map{position:absolute;inset:0;opacity:0;transition:opacity .6s ease}#map.ready{opacity:1}#app{background:radial-gradient(120% 90% at 50% 40%,#7fd3ee,#4fb3d9)}#map canvas{display:block;touch-action:none}#ov3{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
#labels{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lbl.lbl.far{padding:0;width:12px;height:12px;min-width:0;box-sizing:border-box;border-radius:50%;background:var(--sun);border:2px solid #10232b;}.lbl.far>*{display:none}
.lbl.map{background:none;border-color:transparent;box-shadow:none;padding:2px 3px;color:#fff;font:400 14px/1 var(--display);letter-spacing:.2px;text-shadow:0 2px 0 #10232b,2px 0 0 #10232b,-2px 0 0 #10232b,0 -2px 0 #10232b,1.5px 1.5px 0 #10232b,-1.5px 1.5px 0 #10232b,1.5px -1.5px 0 #10232b,-1.5px -1.5px 0 #10232b,0 3px 6px rgba(0,0,0,.35)}.lbl.map .n{color:var(--sun);font:400 12px/1 var(--display)}.lbl.map svg{color:var(--sun);filter:drop-shadow(0 0 1.5px #10232b)}.lbl.map.small{font-size:12px}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;
  background:rgba(19,38,47,.88);color:var(--ink);border:1px solid var(--line);border-radius:999px;
  font:600 12px/1 var(--body);padding:5px 9px 5px 7px;white-space:nowrap;display:flex;align-items:center;gap:5px;
  transition:background .15s}
.lbl:hover,.lbl:focus-visible{background:var(--panel-2);outline:none}
.lbl.sel{background:var(--sun);color:var(--sun-ink);border-color:var(--sun)}
.lbl .n{font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:800}
.lbl.sel .n{color:var(--sun-ink);opacity:.7}
.lbl svg{width:12px;height:12px;flex:none}
.lbl.small{font-size:11px;padding:4px 7px}

/* pannello */
.panel{position:absolute;z-index:6;top:var(--bar-h,76px);right:max(16px,env(safe-area-inset-right,0px));bottom:16px;width:360px;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 18px 40px rgba(5,20,28,.35)}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;color:var(--ink-2);font:700 13px var(--body);padding:9px 4px;white-space:nowrap;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--panel-2);color:var(--ink)}
.tabs button:focus-visible,.btn:focus-visible,.vote:focus-visible,.row:focus-visible,input:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:18px;min-height:0}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:800}
.town-name{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.05;margin:4px 0 0;text-wrap:balance}
.meta{color:var(--ink-2);font-size:13px;line-height:1.5;margin:6px 0 0}
.meta b{color:var(--ink)}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.num{background:var(--panel-2);border-radius:12px;padding:10px 12px}
.num b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.num span{font-size:11px;color:var(--ink-3);font-weight:600}
.sec h3{margin:0 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:800}
.mayor{display:flex;align-items:center;gap:12px;background:var(--panel-2);border-radius:12px;padding:12px}
.mayor .crown{width:36px;height:36px;border-radius:50%;background:var(--sun);display:grid;place-items:center;flex:none}
.mayor .crown svg{width:20px;height:20px}
.mayor b{display:block;font-size:15px}
.mayor span{font-size:12px;color:var(--ink-2)}
.progress{height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden;margin:8px 0 6px}
.progress i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.hint{font-size:12px;color:var(--ink-2);line-height:1.45;margin:0}
.cands{display:flex;flex-direction:column;gap:6px}
.cand{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;background:var(--panel-2);border-radius:10px;padding:8px 8px 8px 12px;position:relative;overflow:hidden}
.cand .bar-v{position:absolute;inset:0 auto 0 0;background:rgba(255,207,63,.13);pointer-events:none}
.cand .who{position:relative;font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cand .who small{display:block;font-size:11px;color:var(--ink-3);font-weight:600;font-variant-numeric:tabular-nums}
.vote{position:relative;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 12px var(--body);border-radius:8px;padding:7px 10px;cursor:pointer}
.vote:hover{border-color:var(--sun)}
.vote[disabled]{opacity:.5;cursor:default}
.btn{border:0;border-radius:12px;padding:12px 14px;font:800 14px var(--body);cursor:pointer;background:var(--sun);color:var(--sun-ink);width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.05)}
.actions{display:flex;gap:8px}
.chain{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.chain li{display:grid;grid-template-columns:18px 1fr;gap:10px;padding-bottom:12px;position:relative}
.chain li::before{content:"";position:absolute;left:8px;top:14px;bottom:0;width:2px;background:var(--line)}
.chain li:last-child::before{display:none}
.chain .dot{width:12px;height:12px;border-radius:50%;margin:3px 0 0 3px;background:var(--line);position:relative;z-index:1}
.chain .on .dot{background:var(--sun)}
.chain .open .dot{background:var(--leaf)}
.chain b{display:block;font-size:13px}
.chain span{font-size:12px;color:var(--ink-2)}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2);font-size:13px;line-height:1.45}
.rules b{color:var(--ink)}
.list{display:flex;flex-direction:column;gap:4px}
.row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;background:transparent;border:0;color:var(--ink);text-align:left;font:inherit;padding:8px 10px;border-radius:10px;cursor:pointer}
.row:hover{background:var(--panel-2)}
.row .pos{font-weight:800;color:var(--ink-3);font-variant-numeric:tabular-nums}
.row .nm{min-width:0}
.row .nm b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm span{font-size:11px;color:var(--ink-3)}
.row .pp{font-weight:800;font-variant-numeric:tabular-nums}
label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
input[type=text]{width:100%;box-sizing:border-box;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);font:500 15px var(--body);padding:11px 12px;border-radius:10px}
.form{display:flex;flex-direction:column;gap:14px}
.msg{font-size:13px;line-height:1.45;margin:0;color:var(--ink-2)}
.msg.err{color:#ffb4a0}
.msg.ok{color:var(--leaf)}
.comment{background:var(--panel-2);border-radius:12px;padding:12px;font-size:13px;line-height:1.45}
.comment b{color:var(--ink)}
.comment span{color:var(--ink-2)}
.demo-note{font-size:11px;color:var(--ink-3);line-height:1.4;margin:0}
.lbl.ghost{background:var(--sun);color:var(--sun-ink);border-color:var(--sun);font-size:13px;padding:6px 11px}
a.btn{display:block;box-sizing:border-box;text-align:center;text-decoration:none}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:13px;line-height:1.45;color:var(--ink-2);counter-increment:s}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--panel-2);color:var(--sun);font:800 13px/26px var(--body);text-align:center}
.steps b{color:var(--ink)}
.callout{background:var(--panel-2);border-radius:12px;padding:12px;font-size:13px;line-height:1.45;color:var(--ink-2)}
.callout b{color:var(--clay)}
.story{display:flex;flex-direction:column;gap:10px}
.story div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:13px;line-height:1.45;color:var(--ink-2)}
.story i{font-style:normal;font-weight:800;font-size:11px;background:var(--sun);color:var(--sun-ink);border-radius:999px;padding:3px 8px;white-space:nowrap}
/* ricerca */
.search{pointer-events:auto;position:relative;flex:1 1 280px;max-width:420px;min-width:0}
.search input{width:100%;box-sizing:border-box;height:52px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--ink);font:600 15px var(--body);padding:0 44px 0 42px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--ink-3);font-weight:500}
.search input:focus{outline:2px solid var(--sun);outline-offset:1px}
.search input::-webkit-search-cancel-button{display:none}
.search .mag{position:absolute;left:14px;top:17px;width:18px;height:18px;color:var(--ink-3);pointer-events:none}
.search kbd{position:absolute;right:12px;top:15px;font:700 12px var(--body);color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:2px 7px;pointer-events:none}
.search input:focus ~ kbd,.search input:not(:placeholder-shown) ~ kbd{display:none}
.search .clear{position:absolute;right:8px;top:10px;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--ink-3);cursor:pointer;display:grid;place-items:center}
.search .clear[hidden]{display:none}
.search .clear:hover{color:var(--ink);background:var(--panel-2)}
.search .clear svg{width:16px;height:16px}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;margin:0;padding:6px;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 18px 40px rgba(5,20,28,.45);max-height:min(430px,60vh);overflow-y:auto;z-index:8}
.results .head{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:800;padding:8px 10px 4px}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer}
.res[aria-selected="true"],.res:hover{background:var(--panel-2)}
.res b{display:block;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res b mark{background:none;color:var(--sun)}
.res small{display:block;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{font:800 10px var(--body);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 8px;white-space:nowrap}
.pill.on{background:var(--sun);color:var(--sun-ink)}
.pill.free{background:rgba(127,194,93,.16);color:var(--leaf)}
.results .empty{padding:12px 10px;font-size:13px;color:var(--ink-2);line-height:1.45}
.results .empty b{color:var(--ink)}
/* costruzioni bloccate */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;background:var(--panel-2);border:1px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.tile:hover{border-color:var(--ink-3)}
.tile:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.tile .ic{width:30px;height:30px;color:var(--ink-3);margin-bottom:4px}
.tile b{font-size:14px}
.tile span{font-size:11px;color:var(--ink-3);line-height:1.3}
.tile .lock{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--panel);display:grid;place-items:center;color:var(--sun)}
.tile .lock svg{width:12px;height:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--body);background:var(--panel-2);color:var(--ink-2);border-radius:999px;padding:6px 10px}
.chip svg{width:11px;height:11px;color:var(--sun)}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:9;background:var(--sun);color:var(--sun-ink);font:800 14px var(--body);padding:10px 16px;border-radius:12px;max-width:calc(100% - 32px);text-align:center}

@media (max-width:760px){
  .panel{top:auto;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));width:auto;height:46%}
  .brand h1{font-size:19px}
  .stats{display:none}
  .search{flex-basis:100%;max-width:none}
  .search kbd{display:none}
  .town-name{font-size:28px}
  .toast{bottom:auto;top:120px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- v3: pulsanti e pannello in stile "giocattolo" (bordo scuro, ombra piena) ---------- */
:root{--edge:#0b1a21}
.btn{border:2px solid var(--edge);border-radius:14px;padding:12px 14px;font:400 17px/1 var(--display);letter-spacing:.3px;box-shadow:0 4px 0 var(--edge);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn.ghost{background:var(--panel-2);color:var(--ink);border:2px solid var(--edge)}
.btn .ic{width:18px;height:18px}
.tabs{gap:6px;padding:10px;border-bottom:0;background:var(--edge)}
.tabs button{border-radius:12px;font:400 15px/1 var(--display);letter-spacing:.3px;padding:10px 4px;color:var(--ink-2);background:var(--panel)}
.tabs button[aria-selected="true"]{background:var(--sun);color:var(--sun-ink);box-shadow:0 3px 0 #b58c12}
.panel{border:2px solid var(--edge);box-shadow:0 6px 0 var(--edge),0 18px 40px rgba(5,20,28,.35)}
.brand,.stats,.search input{border:2px solid var(--edge);box-shadow:0 4px 0 var(--edge)}
.num{border:2px solid var(--edge)}
.num b{font:400 26px/1.1 var(--display)}
.num.lv b{color:var(--sun)}
.sec h3{color:var(--ink-2)}
.chip{background:var(--panel-2);color:var(--ink);border:2px solid var(--edge);font-weight:800}
.chip.f{background:var(--sun);color:var(--sun-ink)}
.callout{border:2px dashed var(--line)}
.callout b{color:var(--sun)}
.progress{height:12px;border:2px solid var(--edge);background:var(--edge)}
.steps li::before{background:var(--sun);color:var(--sun-ink);border:2px solid var(--edge);line-height:22px;width:22px;height:22px}
.roles,.levels{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.roles li,.levels li{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center}
.roles b,.levels b{display:block;font-size:14px}
.roles span,.levels div span{font-size:12px;color:var(--ink-2);line-height:1.4}
.badge{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);border:2px solid var(--edge);font:400 17px var(--display);color:var(--ink)}
.badge.f{background:var(--sun);color:var(--sun-ink)}
.badge.m{background:var(--clay);color:#fff}.badge svg{width:18px;height:18px}
.lvn{font:400 14px/1 var(--display);background:var(--leaf);color:#10301a;border:2px solid var(--edge);border-radius:10px;padding:7px 0;text-align:center}
.tiles{grid-template-columns:repeat(4,1fr);gap:6px}
.tile{border:2px solid var(--edge);border-style:solid;align-items:center;padding:10px 4px;cursor:default;gap:4px}
.tile .ic{width:24px;height:24px;color:var(--sun);margin:0}
.tile b{font-size:11px}
.row .pp{font:400 17px var(--display);color:var(--sun)}
/* pulsanti mappa */
.ctl{position:absolute;z-index:6;left:max(16px,env(safe-area-inset-left,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.ctl button{width:48px;height:48px;border-radius:50%;border:2px solid var(--edge);background:var(--panel);color:var(--ink);box-shadow:0 4px 0 var(--edge);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .08s,box-shadow .08s}
.ctl button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.ctl button:hover{background:var(--panel-2)}
.ctl button svg{width:22px;height:22px}
.ctl .rules-btn{width:auto;border-radius:999px;padding:0 16px 0 12px;display:flex;gap:7px;background:var(--sun);color:var(--sun-ink);font:400 16px/1 var(--display);letter-spacing:.3px}
.ctl .rules-btn:hover{background:var(--sun);filter:brightness(1.05)}
@media (max-width:760px){
  .ctl{left:auto;right:max(12px,env(safe-area-inset-right,0px));bottom:auto;top:calc(var(--bar-h,140px) + 4px);gap:8px}
  .ctl button{width:42px;height:42px}
  .ctl .rules-btn{padding:0 10px;font-size:14px;align-self:flex-end}.ctl .rules-btn svg{display:none}.ctl{align-items:flex-end}
  .tabs button{font-size:14px}
}
.ctl .short{display:none}
@media (max-width:760px){.ctl .long{display:none}.ctl .short{display:inline}}
.sheet-t{display:none}
@media (max-width:760px){
  .panel{max-height:calc(100% - var(--bar-h,140px) - 24px)}
  .sheet-t{display:grid;place-items:center;flex:0 0 44px;border:0;border-radius:12px;background:var(--panel);color:var(--ink);cursor:pointer;padding:0}
  .sheet-t svg{width:22px;height:22px;transition:transform .2s}
  .panel.min{height:auto}
  .panel.min .body{display:none}
  .panel.min .sheet-t svg{transform:rotate(180deg)}
}
@media (max-width:760px) and (max-height:720px){.ctl{flex-direction:row;align-items:center}.ctl .rules-btn{align-self:center}}
/* pinch e trascinamento: solo la mappa si muove, mai la pagina (si scorre solo dentro il pannello e i risultati) */

const ease3 = u => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
function tick(){
  requestAnimationFrame(tick);

  if (flyA) { const u = Math.min(1, (performance.now() - flyA.t0) / flyA.dur), p = flyA.f.at(ease3(u) * flyA.f.S);
    api.view.x = p.x; api.view.y = p.y; api.view.h = p.h; dirty = true; if (u >= 1) flyA = null; }
  if (!ptrs.size && (Math.abs(vel.x) + Math.abs(vel.y)) * 16 > api.view.h * 0.0004) {   // inerzia dopo il trascinamento
    api.view.x += vel.x * 16; api.view.y += vel.y * 16; vel.x *= 0.92; vel.y *= 0.92; dirty = true; }
  if (zoomT) { const r = zoomT.h / api.view.h; if (Math.abs(Math.log(r)) < 0.004) { zoomAt(r, zoomT.cx, zoomT.cy); zoomT = null; } else zoomAt(Math.pow(r, 0.22), zoomT.cx, zoomT.cy); }

// ---------- ricerca città: 107k città GeoNames (≥1000 abitanti), ordinate per popolazione ----------
// indice per prefisso di 2 lettere di ogni parola + alias (Milano → Milan) + tolleranza agli errori di battitura
const CN=(()=>{ try{ const d=new Intl.DisplayNames(['en'],{type:'region'}); return cc=>{ try{ return d.of(cc)||cc; }catch(e){ return cc; } }; }catch(e){ return cc=>cc; } })();
const SPECIAL={'ß':'ss','ø':'o','æ':'ae','œ':'oe','ł':'l','đ':'d','ı':'i','þ':'th','ð':'d'};
function norm(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[ßøæœłđıþð]/g,c=>SPECIAL[c])
    .replace(/['’`.]/g,'').replace(/[^a-z0-9Ͱ-￿]+/g,' ').trim();
}
let G=null;
let GEO_TXT=null, geoTxtP=null;
function loadGeoTxt(){ return geoTxtP||(geoTxtP=fetch(WEB_FILES.cities).then(r=>r.text()).then(t=>{ GEO_TXT=t; if(document.activeElement===qEl) showResults(); })); }
function geoIndex(){
  if(G) return G;
  // + città fondate che GeoNames non ha come centro abitato a sé
  if(GEO_TXT==null){ loadGeoTxt(); return null; }
  const rows=GEO_TXT.split('\n').concat(["Nürburg\tDE\t3vu\tjb\t2","Skudai\tMY\t49\t7zy\t18d"]);
  const N=rows.length, name=new Array(N), cc=new Array(N), nn=new Array(N);
  const lat=new Float32Array(N), lon=new Float32Array(N), pop=new Uint32Array(N);
  const b1=new Map(), b2=new Map();
  const add=(m,k,i)=>{ let a=m.get(k); if(!a) m.set(k,a=[]); if(a[a.length-1]!==i) a.push(i); };
  for(let i=0;i<N;i++){
    const f=rows[i].split('\t');
    name[i]=f[0]; cc[i]=f[1]; lat[i]=parseInt(f[2],36)/100; lon[i]=parseInt(f[3],36)/100; pop[i]=parseInt(f[4],36)*100;
    const n=nn[i]=norm(f[0]);
    add(b1,n[0],i);
    for(const w of n.split(' ')) if(w) add(b2,w.slice(0,2),i);
  }
  const alias=document.getElementById('geo-alias').textContent.split('\n').filter(Boolean).map(l=>{ const f=l.split('\t'); return [norm(f[0]),+f[1]]; });
  const onMap=new Map();
  realTowns().forEach(t=>{
    const tn=norm(t.nome);
    for(const i of (b2.get(tn.slice(0,2))||[])) if(nn[i]===tn && CN(cc[i])===t.regione){ onMap.set(i,t); t.geo=i; break; }
    if(t.geo==null) for(const [a,i] of alias) if(a===tn && CN(cc[i])===t.regione){ onMap.set(i,t); t.geo=i; break; }
  });
  G={N,name,cc,nn,lat,lon,pop,b1,b2,alias,onMap};
  return G;
}
// distanza di edit (con scambio di lettere vicine), si ferma appena supera max
function lev(a,b,max){
  const la=a.length, lb=b.length; if(Math.abs(la-lb)>max) return max+1;
  let pp=null, p=new Array(lb+1), c=new Array(lb+1);
  for(let j=0;j<=lb;j++) p[j]=j;
  for(let i=1;i<=la;i++){
    c[0]=i; let mn=i;
    for(let j=1;j<=lb;j++){
      let v=Math.min(p[j]+1, c[j-1]+1, p[j-1]+(a[i-1]===b[j-1]?0:1));
      if(pp&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) v=Math.min(v,pp[j-2]+1);
      c[j]=v; if(v<mn) mn=v;
    }
    if(mn>max) return max+1;
    const t=pp||new Array(lb+1); pp=p; p=c; c=t;
  }
  return p[lb];
}
function searchCities(raw){
  const g=geoIndex(), parts=raw.split(','), q=norm(parts[0]), cq=parts[1]?norm(parts[1]):'';
  if(!q) return [];
  const okC=i=>!cq || g.cc[i].toLowerCase()===cq || norm(CN(g.cc[i])).startsWith(cq);
  const toks=q.split(' '), seen=new Set(), hits=[];
  const put=(s,i)=>{ if(seen.has(i)||!okC(i)) return; seen.add(i); hits.push([g.onMap.has(i)?s-3:s,i]); };
  const cand=q.length===1 ? (g.b1.get(q)||[]) : (g.b2.get(toks[0].slice(0,2))||[]);
  for(const i of cand){
    const n=g.nn[i];
    if(n===q) put(0,i);
    else if(n.startsWith(q)) put(1,i);
    else if(q.length>1){ const ws=n.split(' '); if(toks.every(t=>ws.some(w=>w.startsWith(t)))) put(2,i); }
  }
  for(const [a,i] of g.alias) if(a.startsWith(q)) put(a===q?0:1,i);
  if(hits.length<5 && q.length>=3){
    const max=q.length>=7?2:1;
    for(const i of (g.b1.get(q[0])||[])){
      if(seen.has(i)) continue;
      const n=g.nn[i];
      let d=lev(q,n,max);
      if(d>max && n.length>q.length) d=lev(q,n.slice(0,q.length),max);
      if(d<=max) put(10+d,i);
    }
  }
  hits.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  return hits.slice(0,8).map(h=>({i:h[1],fuzzy:h[0]>=7}));
}
function fmtPop(n){ return n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+'M people':n>=1e3?Math.round(n/1e3)+'k people':n+' people'; }
function markName(nm,q){
  const nq=norm(q.split(',')[0]); if(!nq) return esc(nm);
  for(let k=1;k<=nm.length;k++) if(norm(nm.slice(0,k))===nq) return '<mark>'+esc(nm.slice(0,k))+'</mark>'+esc(nm.slice(k));
  return esc(nm);
}

const qEl=document.getElementById('q'), resEl=document.getElementById('results'), qClear=document.getElementById('q-clear');
let resList=[], resActive=-1, resRaf=0;
function openResults(html){
  resEl.innerHTML=html; resEl.hidden=false; qEl.setAttribute('aria-expanded','true');
}
function closeResults(){
  resEl.hidden=true; qEl.setAttribute('aria-expanded','false'); qEl.removeAttribute('aria-activedescendant'); resActive=-1;
}
function resRow(i,k,raw){
  const g=G, t=g.onMap.get(i);
  return `<li class="res" role="option" id="res-${k}" data-k="${k}" aria-selected="false">
    <span style="min-width:0"><b>${markName(g.name[i],raw)}</b><small>${esc(CN(g.cc[i]))} · ${t?'founder '+esc(t.fondatore):fmtPop(g.pop[i])}</small></span>
    ${t?'<span class="pill on">On the map</span>':'<span class="pill free">Free</span>'}</li>`;
}
function showResults(){
  const raw=qEl.value; qClear.hidden=!raw;
  const g=geoIndex();
  if(!g){ openResults('<li class="empty" role="presentation">Loading cities…</li>'); return; }
  if(!raw.trim()){
    resList=[...g.onMap.keys()];
    openResults('<li class="head" role="presentation">On the map now</li>'+resList.map((i,k)=>resRow(i,k,'')).join('')
      +'<li class="empty" role="presentation">Type any city or town. Accents and small typos are fine.</li>');
    return;
  }
  const r=searchCities(raw); resList=r.map(x=>x.i); resActive=r.length?0:-1;
  if(!r.length){
    openResults(`<li class="empty" role="presentation">No city called <b>${esc(raw.trim())}</b> in our list. If it's a real town, comment it anyway: we add every real town.</li>`);
    return;
  }
  const fz=r.findIndex(x=>x.fuzzy);
  openResults(r.map((x,k)=>(k===fz?'<li class="head" role="presentation">Did you mean</li>':'')+resRow(x.i,k,x.fuzzy?'':raw)).join(''));
  setActive(0);
}
function setActive(k){
  resActive=k;
  resEl.querySelectorAll('.res').forEach(el=>el.setAttribute('aria-selected', +el.dataset.k===k));
  const el=document.getElementById('res-'+k);
  if(el){ qEl.setAttribute('aria-activedescendant','res-'+k); el.scrollIntoView({block:'nearest'}); }
}
qEl.addEventListener('input',()=>{ cancelAnimationFrame(resRaf); resRaf=requestAnimationFrame(showResults); });
qEl.addEventListener('focus',()=>{ showResults(); qEl.select(); });
qEl.addEventListener('blur',()=>setTimeout(closeResults,120));
qEl.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault(); if(resEl.hidden) showResults();
    if(resList.length) setActive((resActive+(e.key==='ArrowDown'?1:-1)+resList.length)%resList.length);
  } else if(e.key==='Enter'){
    e.preventDefault(); if(resList.length) pickCity(resList[Math.max(0,resActive)]);
  } else if(e.key==='Escape'){ closeResults(); qEl.blur(); }
});
resEl.addEventListener('pointerdown',e=>{
  const li=e.target.closest('.res'); if(!li) return;
  e.preventDefault(); pickCity(resList[+li.dataset.k]);
});
qClear.addEventListener('click',()=>{ qEl.value=''; qEl.focus(); showResults(); });
document.addEventListener('keydown',e=>{
  if(e.key==='/' && document.activeElement!==qEl && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); qEl.focus(); }
});

let preview=null;
function pickCity(i){
  const g=geoIndex(); qEl.value=g.name[i]; qClear.hidden=false; closeResults(); qEl.blur();
  if(preview){ towns.splice(towns.indexOf(preview),1); preview=null; }
  const t=g.onMap.get(i);
  if(t){ buildWorld(); select(t.id,true); return; }
  preview=T(g.name[i],CN(g.cc[i]),g.lat[i],g.lon[i],1,"",null,0);
  preview.ghost=true; preview.preview=true; preview.realPop=g.pop[i];
  towns.push(preview); buildWorld(); select(preview.id,true);
}

let toastT=null;
function toast(s){
  const el=document.getElementById('toast'); el.textContent=s; el.hidden=false;
  clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,3200);
}
